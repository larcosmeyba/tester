# Mirrors cloudbuild.server.yaml, with the repository root as the build
# context so paths match the other services.
steps:
  - id: test
    name: python:3.11-slim
    waitFor: ['-']
    entrypoint: bash
    args:
      - -ceu
      - |
        cd apps/transcriber && pip install --no-cache-dir --quiet . pytest httpx
        python -m pytest -q

  - id: cache-pull
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    waitFor: ['-']
    args:
      - -ceu
      - |
        docker pull '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/transcriber:buildcache' || true

  - id: build
    name: gcr.io/cloud-builders/docker
    env: [DOCKER_BUILDKIT=1]
    waitFor: [cache-pull]
    args:
      - build
      - --file=Dockerfile.transcriber
      - --cache-from=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/transcriber:buildcache
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/transcriber:$BUILD_ID
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/transcriber:buildcache
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    waitFor: [test, build]
    args:
      - -ceu
      - |
        docker push '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/transcriber:$BUILD_ID'
        docker push '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/transcriber:buildcache'

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [push]
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud run deploy '${_SERVICE}' \
          --project='$PROJECT_ID' \
          --region='${_REGION}' \
          --image='${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/transcriber:$BUILD_ID' \
          --service-account='${_SERVICE_ACCOUNT}' \
          --ingress=internal \
          --no-allow-unauthenticated \
          --set-env-vars=APP_ENV=production \
          --set-secrets='RECIPE_AI_API_KEY=${_AI_KEY_SECRET}:latest' \
          --set-secrets='IMPORT_SHARED_SECRET=${_SHARED_SECRET}:latest' \
          --port=8080 \
          --startup-probe='initialDelaySeconds=0,timeoutSeconds=3,periodSeconds=3,failureThreshold=10,httpGet.port=8080,httpGet.path=/readyz' \
          --liveness-probe='initialDelaySeconds=10,timeoutSeconds=3,periodSeconds=10,failureThreshold=3,httpGet.port=8080,httpGet.path=/healthz' \
          --min-instances=1 --max-instances=1 \
          --concurrency=4 --cpu=1 --memory=2Gi --timeout=600 \
          --quiet

  - id: verify
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [deploy]
    entrypoint: bash
    args:
      - -ceu
      - |
        # Internal ingress means Cloud Build cannot reach the service's HTTP
        # endpoints directly. Confirm the revision is Ready; then, from inside
        # the project, check GET /readyz returns 200 (503 means the recipe AI
        # key is missing).
        STATUS="$$(gcloud run services describe '${_SERVICE}' --project='$PROJECT_ID' --region='${_REGION}' --format='value(status.conditions[0].status)')"
        test "$${STATUS}" = True

substitutions:
  _REGION: us-central1
  _REPOSITORY: hth
  _SERVICE: hth-transcriber
  # Set at submit time, e.g.:
  #   helpthehive-dev-transcriber-run@<PROJECT_ID>.iam.gserviceaccount.com
  _SERVICE_ACCOUNT: ''
  # Secret names follow the helpthehive-{dev,prod}- convention. The secrets
  # themselves must already exist; see docs/deployment/gcp.md.
  _AI_KEY_SECRET: helpthehive-dev-recipe-ai-api-key
  _SHARED_SECRET: helpthehive-dev-import-shared-secret

options:
  logging: CLOUD_LOGGING_ONLY
