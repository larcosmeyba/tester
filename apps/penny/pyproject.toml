[project]
name = "helpthehive-penny"
version = "0.1.0"
description = "Penny — the Help The Hive conversational assistant"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "langgraph>=0.2.45",
  "langchain-core>=0.3.15",
  "structlog>=24.4",
]

[project.optional-dependencies]
# Provider SDKs are optional. Penny runs on the fake provider with neither
# installed, which is what CI and the eval suite use.
anthropic = ["anthropic>=0.39"]
openai = ["openai>=1.54"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "evals"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["penny"]
