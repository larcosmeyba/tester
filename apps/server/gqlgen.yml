schema:
  - ../../packages/api-contract/schema.graphql
  - ../../packages/api-contract/meals.graphql
  - ../../packages/api-contract/benefits.graphql
  - ../../packages/api-contract/meal-profile.graphql
  - ../../packages/api-contract/meal-actions.graphql
  - ../../packages/api-contract/meal-prep.graphql

exec:
  filename: internal/graphql/generated/generated.go
  package: generated

model:
  filename: internal/graphql/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: internal/graphql
  package: graphql
  filename_template: '{name}.resolvers.go'

models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
  Map:
    model:
      - github.com/99designs/gqlgen/graphql.Map
