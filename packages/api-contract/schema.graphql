schema {
  query: Query
  mutation: Mutation
}

type Query {
  viewer: Viewer!
  handleAvailability(handle: String!): HandleAvailability!
  pantryItems(filter: PantryItemFilterInput): [PantryItem!]!
  pantryWasteStats: WasteStats!
}

type Mutation {
  deleteViewerData: Boolean!
  updateProfile(input: UpdateProfileInput!): Profile!
  updateHandle(handle: String!): Profile!
  updatePreferences(input: UpdatePreferencesInput!): AppPreferences!
  completeOnboarding(input: CompleteOnboardingInput!): Viewer!
  recordConsent(input: RecordConsentInput!): Boolean!
  addPantryItem(input: AddPantryItemInput!): PantryItem!
  updatePantryItem(id: ID!, input: UpdatePantryItemInput!): PantryItem!
  markPantryItemUsed(id: ID!): PantryItem!
  deletePantryItem(id: ID!): Boolean!
  registerPushToken(input: RegisterPushTokenInput!): PushToken!
  deletePushToken(token: String!): Boolean!
}

type Viewer {
  user: User!
  profile: Profile!
  preferences: AppPreferences!
  onboardingState: OnboardingState!
  consent: Consent
}

type User {
  id: ID!
  authSubject: String!
  email: String
  createdAt: String!
  updatedAt: String!
}

type Profile {
  handle: String
  firstName: String!
  lastName: String!
  phone: String!
  zip: String!
  householdSize: Int!
  profileImageUri: String
  createdAt: String!
  updatedAt: String!
}

type HandleAvailability {
  handle: String!
  available: Boolean!
  reason: HandleAvailabilityReason!
  retryAfter: String
}

enum HandleAvailabilityReason {
  AVAILABLE
  CURRENT
  INVALID_FORMAT
  RESERVED
  UNAVAILABLE
  COOLDOWN
}

type AppPreferences {
  weeklyBudget: String!
  preferredFinanceTopics: [String!]!
  preferredResources: [String!]!
  wantsGovAssistance: Boolean!
  lastMealPlanDate: String
  notificationsEnabled: Boolean!
  expiringPantryNotificationsEnabled: Boolean!
  weeklyMealPlanNotificationsEnabled: Boolean!
  resourceReminderNotificationsEnabled: Boolean!
  benefitsRenewalNotificationsEnabled: Boolean!
  benefitsRenewalDiscreetLockScreen: Boolean!
  selectedBenefitPrograms: [String!]!
  locationPermissionStatus: String!
  createdAt: String!
  updatedAt: String!
}

type OnboardingState {
  hasCompletedOnboarding: Boolean!
  completedAt: String
  createdAt: String!
  updatedAt: String!
}

type Consent {
  termsVersion: String!
  termsAcceptedAt: String!
  privacyVersion: String!
  privacyAcceptedAt: String!
  emailMarketingOptIn: Boolean!
  emailMarketingUpdatedAt: String!
}

type PantryItem {
  id: ID!
  name: String!
  quantity: String!
  location: StorageLocation!
  expirationDate: String!
  category: String!
  status: ItemStatus!
  dateAdded: String!
  dateUsed: String
  createdAt: String!
  updatedAt: String!
}

type WasteStats {
  totalAdded: Int!
  totalUsed: Int!
  totalExpired: Int!
  estimatedWasteValue: Float!
  mostWastedCategories: [String!]!
}

type PushToken {
  id: ID!
  token: String!
  platform: PushPlatform!
  deviceId: String
  createdAt: String!
  updatedAt: String!
  lastSeenAt: String!
}

enum StorageLocation {
  PANTRY
  REFRIGERATOR
  FREEZER
}

enum ItemStatus {
  ACTIVE
  USED
  EXPIRED
}

enum PushPlatform {
  IOS
  ANDROID
  WEB
}

input PantryItemFilterInput {
  status: ItemStatus
  location: StorageLocation
}

input UpdateProfileInput {
  firstName: String
  lastName: String
  phone: String
  zip: String
  householdSize: Int
  profileImageUri: String
}

input UpdatePreferencesInput {
  weeklyBudget: String
  preferredFinanceTopics: [String!]
  preferredResources: [String!]
  wantsGovAssistance: Boolean
  lastMealPlanDate: String
  notificationsEnabled: Boolean
  expiringPantryNotificationsEnabled: Boolean
  weeklyMealPlanNotificationsEnabled: Boolean
  resourceReminderNotificationsEnabled: Boolean
  selectedBenefitPrograms: [String!]
  locationPermissionStatus: String
  emailMarketingOptIn: Boolean
}

input RecordConsentInput {
  termsVersion: String!
  privacyVersion: String!
  emailMarketingOptIn: Boolean!
}

input CompleteOnboardingInput {
  profile: UpdateProfileInput
  preferences: UpdatePreferencesInput
}

input AddPantryItemInput {
  name: String!
  quantity: String!
  location: StorageLocation!
  expirationDate: String!
  category: String!
}

input UpdatePantryItemInput {
  name: String
  quantity: String
  location: StorageLocation
  expirationDate: String
  category: String
  status: ItemStatus
}

input RegisterPushTokenInput {
  token: String!
  platform: PushPlatform!
  deviceId: String
}

# --- Sign Up / Login / Onboarding v2 (2026-09-14) ---

enum VerificationMethod {
  EMAIL
}

enum VerificationPurpose {
  SIGNUP
  EMAIL_CHANGE
  PHONE_CHANGE
  RECOVERY
}

type VerificationStatus {
  verified: Boolean!
  verifiedAt: String
  method: VerificationMethod
}

type QuestionnaireAnswers {
  weeklyBudget: String
  financeTopics: [String!]!
  resources: [String!]!
  primaryGoal: String
  householdSize: String
  incomeBracket: String
  updatedAt: String!
}

input SaveQuestionnaireInput {
  weeklyBudget: String
  financeTopics: [String!]
  resources: [String!]
  primaryGoal: String
  householdSize: String
  incomeBracket: String
}

input RequestVerificationCodeInput {
  method: VerificationMethod!
  purpose: VerificationPurpose = SIGNUP
  newEmail: String
  newPhone: String
}

input UpdateCommunicationConsentsInput {
  emailConsent: Boolean
  phoneCallConsent: Boolean
}

extend type Mutation {
  requestVerificationCode(input: RequestVerificationCodeInput!): Boolean!
  verifyCode(code: String!): Boolean!
  saveQuestionnaire(input: SaveQuestionnaireInput!): QuestionnaireAnswers!
  saveOnboardingStep(step: String!): Boolean!
  updateCommunicationConsents(input: UpdateCommunicationConsentsInput!): Boolean!
}

extend type Viewer {
  questionnaireAnswers: QuestionnaireAnswers!
  verification: VerificationStatus!
}

extend type OnboardingState {
  currentStep: String
}

extend type Mutation {
  saveLocationFallback(zip: String!): Boolean!
}
