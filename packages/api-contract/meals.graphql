# ---------------------------------------------------------------------------
# Meals
#
# The meal system's engine lives on the server: recipe filtering for diets and
# allergies, household scaling, pantry matching, pricing, scoring, week
# optimisation and grocery consolidation. The app collects answers and renders
# what comes back.
#
# Ownership is never a client concern. No meal field accepts a user id; the
# viewer is resolved from the verified JWT on every call.
# ---------------------------------------------------------------------------

extend type Query {
  "The public recipe library plus the viewer's own recipes."
  recipes(query: RecipeQueryInput): [Recipe!]!
  recipe(recipeId: ID!): Recipe
  savedRecipes: [Recipe!]!
  "Canonical ingredient catalogue, used by the pantry and allergy pickers."
  ingredients(search: String, limit: Int): [Ingredient!]!
  "The plan the viewer is currently on, or null when they have none yet."
  currentMealPlan: MealPlan
  mealPlan(planId: ID!): MealPlan
  "The saved grocery list for a plan, or null before the plan is accepted."
  groceryList(planId: ID!): GroceryListPayload
  """
  The viewer's saved questionnaire, or null when they have never answered it.
  Never answering it is a normal state, not an error.
  """
  mealPreferences: MealPreferences
}

extend type Mutation {
  """
  Generates and saves a week.

  `input` is the questionnaire. Omit it to plan from the preferences the viewer
  saved last time; supply it to plan from a fresh answer set, which is also
  saved. Either way the viewer's pantry is read on the server and credited
  before anything reaches the grocery list — it is never sent by the client.
  """
  generateMealPlan(input: PlanRequestInput): MealPlan!
  "Saves the questionnaire without generating a plan."
  saveMealPreferences(input: PlanRequestInput!): MealPreferences!
  "Forgets the saved questionnaire. Plans already generated are unaffected."
  deleteMealPreferences: Boolean!
  "Replaces one slot's recipe. keepBasket avoids re-pricing the whole week."
  swapPlannedMeal(planId: ID!, input: SwapMealInput!): MealPlan!
  "Moves a meal between slots. Never regenerates the week and never re-prices."
  movePlannedMeal(planId: ID!, input: MoveMealInput!): MealPlan!
  "Turns the plan into a saved, consolidated, pantry-aware grocery list."
  acceptMealPlan(planId: ID!): GroceryListPayload!
  deleteMealPlan(planId: ID!): Boolean!
  setGroceryItemChecked(planId: ID!, ingredientId: ID!, checked: Boolean!): Boolean!
  "Choose My Recipes: selected recipes to a consolidated list, nothing saved."
  groceryListFromRecipes(input: GroceryListFromRecipesInput!): GroceryListPayload!
  saveRecipe(recipeId: ID!): Boolean!
  unsaveRecipe(recipeId: ID!): Boolean!
}

"An arbitrary JSON object. Used only for the cost tier mix."
scalar Map

enum DataConfidence {
  high
  medium
  low
}

"How a single recipe value was established. `missing` is never guessed away."
enum ValueConfidence {
  source
  human
  inferred
  missing
}

enum Strength {
  required
  preferred
}

enum MealType {
  breakfast
  lunch
  dinner
  snack
  dessert
  side
}

enum Diet {
  vegan
  vegetarian
  pescatarian
  gluten_free
  dairy_free
  egg_free
  nut_free
}

enum Allergen {
  milk
  egg
  fish
  shellfish
  tree_nut
  peanut
  wheat
  soy
  sesame
}

enum NutritionGoal {
  high_protein
  high_fiber
  more_produce
  lower_sodium
  lower_calorie
  balanced
}

enum BudgetMode {
  lowest
  balanced
  variety
}

enum Equipment {
  stovetop
  oven
  microwave
  grill
  blender
  air_fryer
  slow_cooker
  instant_pot
}

enum CookingStyle {
  quick_easy
  few_ingredients
  one_pot
  meal_prep
  family_friendly
  kid_friendly
  freezer_friendly
  use_what_i_have
  lowest_cost
  variety
}

enum LeftoversPreference {
  yes
  sometimes
  no
}

enum SwapAction {
  swap_slot
  cheaper
  higher_protein
  faster
  dislike
  regenerate_week
}

type Ingredient {
  ingredientId: ID!
  displayName: String!
  aisle: String!
  foodGroup: String!
  priceReferenceUnit: String!
  isPantryStaple: Boolean!
  "salt, pepper and water only: never added to a grocery list."
  assumedOnHand: Boolean!
  allergens: [Allergen!]!
}

"""
One ingredient line of a recipe. `quantity` is null when the source never
stated one — it is never invented, and `missingInformation` says so instead.
"""
type IngredientLine {
  position: Int!
  rawText: String!
  ingredientId: ID
  displayName: String
  quantity: Float
  unit: String
  preparation: String
  grams: Float
  isOptional: Boolean!
  isToTaste: Boolean!
  missingInformation: String
}

type InstructionStep {
  step: Int!
  text: String!
  minutes: Int
}

"Per-serving nutrition. Null where the source never stated it."
type NutritionInfo {
  basis: String!
  perServing: Boolean!
  caloriesKcal: Float
  proteinG: Float
  carbsG: Float
  fatG: Float
  fiberG: Float
  sodiumMg: Float
  coveragePct: Float
  confidence: DataConfidence
}

"""
The Standard HTH Recipe Object. One format for library, AI-generated, imported
and hand-entered recipes; `sourceType` is a field, not a second type.
"""
type Recipe {
  recipeId: ID!
  "null for a public library recipe."
  ownerUserId: ID
  title: String!
  description: String
  sourceType: String!
  sourceUrl: String
  sourceName: String
  licenseId: String
  attributionText: String
  visibility: String!
  reviewStatus: String!
  servings: Float
  servingsConfidence: ValueConfidence!
  servingSizeText: String
  scalable: Boolean!
  prepTimeMinutes: Int
  cookTimeMinutes: Int
  totalTimeMinutes: Int
  timeConfidence: ValueConfidence!
  mealTypes: [MealType!]!
  cuisine: String
  difficulty: Int
  equipmentRequired: [Equipment!]!
  isComponent: Boolean!
  tags: [String!]!
  ingredients: [IngredientLine!]!
  instructions: [InstructionStep!]!
  nutrition: NutritionInfo
  "Computed server-side. Incomplete recipes stay viewable but are never planned."
  baseMealPlanEligible: Boolean!
  missingInformation: [String!]!
}

"""
An estimated cost is always a range with a confidence, never fake precision.
Budget compliance is checked against `high`.
"""
type CostRange {
  point: Float!
  low: Float!
  high: Float!
  confidence: DataConfidence!
  "Share of the basket priced at each tier, e.g. {\"1\": 0.4, \"3\": 0.6}."
  tierMix: Map
  basis: String
}

type MealSlot {
  day: Int!
  mealType: MealType!
}

type PlannedMeal {
  slot: MealSlot!
  recipeId: ID!
  title: String!
  totalTimeMinutes: Int
  scaleFactor: Float!
  servingsPlanned: Float!
  proteinGPerServing: Float
  goalIndicator: String
  pantryIngredientsUsed: [ID!]!
  incrementalCheckoutCost: Float
  consumedCost: Float
  "Penny's one-line explanation, written by the server from computed facts."
  why: String
}

"""
A consolidated grocery line. Items already in the pantry are kept with
`inPantry: true` and zero cost rather than hidden, so nothing goes missing.
"""
type GroceryItem {
  ingredientId: ID!
  displayName: String!
  neededQty: Float!
  unit: String!
  "null for loose items sold by weight."
  packages: Int
  packageLabel: String
  estimatedPrice: Float!
  priceTier: Int
  inPantry: Boolean!
  isChecked: Boolean!
  "Titles of the recipes this line is for."
  usedBy: [String!]!
}

type GrocerySection {
  aisle: String!
  items: [GroceryItem!]!
}

type GroceryListPayload {
  planId: ID
  sections: [GrocerySection!]!
  cost: CostRange!
}

type NutritionGoalSummary {
  goal: String!
  metBy: Int!
  of: Int!
  avgProteinG: Float
}

type BalancedMealBaseline {
  applied: Boolean!
  avgScore: Float
}

type PlanSummary {
  householdSize: Int!
  mealsPlanned: Int!
  budget: Float
  estimatedCost: CostRange!
  "budget minus estimatedCost.high; null when no budget was set."
  headroom: Float
  consumedCostTotal: Float
  pantryValueUsed: Float
  pantryItemsUsed: [ID!]!
  nutritionGoal: NutritionGoalSummary
  balancedMealBaseline: BalancedMealBaseline
}

type MealPlan {
  planId: ID!
  status: String!
  summary: PlanSummary!
  meals: [PlannedMeal!]!
  groceryList: [GrocerySection!]!
  "AI-written text. Never a source of numbers."
  pennyMessage: String!
  swapOptions: [SwapAction!]!
  assumptions: [String!]!
}

input RecipeQueryInput {
  "Taxonomy ids: OR within a family, AND across families."
  tagIds: [String!]
  mealType: MealType
  search: String
  limit: Int
}

input HouseholdInput {
  size: Int!
  adults: Int
  children: Int
  "True when the user picked 8+; size is stored as 8."
  sizeIsPlus: Boolean!
}

input MealCountsInput {
  breakfast: Int!
  lunch: Int!
  dinner: Int!
  snack: Int!
}

input BudgetInput {
  amount: Float!
  currency: String!
  mode: BudgetMode!
}

input DietRequirementInput {
  diet: Diet!
  strength: Strength!
}

"Allergies are always required; the server rejects any other strength."
input AllergyRequirementInput {
  allergen: Allergen!
  strength: Strength!
}

input NutritionPreferenceInput {
  goal: NutritionGoal!
  strength: Strength!
}

input FoodPreferencesInput {
  ingredients: [String!]!
  cuisines: [String!]!
  freeText: String
}

input CookingTimeInput {
  maxMinutes: Int
  strength: Strength!
}

input PlanRequestInput {
  questionnaireVersion: String!
  planScope: String
  household: HouseholdInput!
  meals: MealCountsInput!
  days: Int!
  budget: BudgetInput!
  "Canonical ingredient ids, not free text."
  pantryItems: [ID!]!
  dietaryRequirements: [DietRequirementInput!]!
  dietaryOtherText: String
  allergies: [AllergyRequirementInput!]!
  "Other allergies, resolved to ingredient ids before submit."
  allergyIngredients: [ID!]!
  nutritionPreferences: [NutritionPreferenceInput!]!
  likes: FoodPreferencesInput!
  dislikes: FoodPreferencesInput!
  cookingTime: CookingTimeInput!
  equipment: [Equipment!]!
  cookingStyle: [CookingStyle!]!
  leftovers: LeftoversPreference!
  excludeRecipeIds: [ID!]!
  seed: Int
}

input MealSlotInput {
  day: Int!
  mealType: MealType!
}

input SwapMealInput {
  slot: MealSlotInput!
  action: SwapAction!
  keepBasket: Boolean
}

input MoveMealInput {
  from: MealSlotInput!
  to: MealSlotInput!
}

input GroceryListFromRecipesInput {
  recipeIds: [ID!]!
  householdSize: Int!
  pantryItems: [ID!]!
}

# ---------------------------------------------------------------------------
# Saved meal preferences
#
# The questionnaire, kept between plans, so a household answers it once rather
# than on every generation. These are the output shapes of the same values
# `PlanRequestInput` collects.
#
# `pantryItems` is deliberately absent. What the household has is read from the
# pantry itself on every generation, so a saved copy can never tell the planner
# somebody owns something they have since used.
# ---------------------------------------------------------------------------

type Household {
  size: Int!
  adults: Int
  children: Int
  "True when the user picked 8+; size is stored as 8."
  sizeIsPlus: Boolean!
}

"How many of each category to plan across the whole week, not per day."
type MealCounts {
  breakfast: Int!
  lunch: Int!
  dinner: Int!
  snack: Int!
}

type GroceryBudget {
  "0 means no budget was set. It is never a claim that a household has nothing."
  amount: Float!
  currency: String!
  mode: BudgetMode!
}

type DietRequirement {
  diet: Diet!
  strength: Strength!
}

"Allergies are always required; the server rejects any other strength."
type AllergyRequirement {
  allergen: Allergen!
  strength: Strength!
}

type NutritionPreference {
  goal: NutritionGoal!
  strength: Strength!
}

type FoodPreferences {
  ingredients: [String!]!
  cuisines: [String!]!
  freeText: String
}

"A required limit excludes a recipe; a preferred one only ranks it."
type CookingTimeLimit {
  maxMinutes: Int
  strength: Strength!
}

type MealPreferences {
  questionnaireVersion: String!
  planScope: String!
  household: Household!
  meals: MealCounts!
  days: Int!
  budget: GroceryBudget!
  dietaryRequirements: [DietRequirement!]!
  dietaryOtherText: String
  allergies: [AllergyRequirement!]!
  "Other allergies, as canonical ingredient ids."
  allergyIngredientIds: [ID!]!
  nutritionPreferences: [NutritionPreference!]!
  likes: FoodPreferences!
  dislikes: FoodPreferences!
  cookingTime: CookingTimeLimit!
  equipment: [Equipment!]!
  cookingStyle: [CookingStyle!]!
  leftovers: LeftoversPreference!
  "Recipes the viewer has rejected, so a regeneration does not bring them back."
  excludeRecipeIds: [ID!]!
}
