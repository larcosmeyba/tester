query PantryItems($filter: PantryItemFilterInput) {
  pantryItems(filter: $filter) {
    id
    name
    quantity
    location
    expirationDate
    category
    status
    dateAdded
    dateUsed
    createdAt
    updatedAt
  }
}

query PantryWasteStats {
  pantryWasteStats {
    totalAdded
    totalUsed
    totalExpired
    estimatedWasteValue
    mostWastedCategories
  }
}

mutation AddPantryItem($input: AddPantryItemInput!) {
  addPantryItem(input: $input) {
    id
    name
    quantity
    location
    expirationDate
    category
    status
    dateAdded
    dateUsed
    createdAt
    updatedAt
  }
}

mutation UpdatePantryItem($id: ID!, $input: UpdatePantryItemInput!) {
  updatePantryItem(id: $id, input: $input) {
    id
    name
    quantity
    location
    expirationDate
    category
    status
    dateAdded
    dateUsed
    createdAt
    updatedAt
  }
}

mutation MarkPantryItemUsed($id: ID!) {
  markPantryItemUsed(id: $id) {
    id
    name
    quantity
    location
    expirationDate
    category
    status
    dateAdded
    dateUsed
    createdAt
    updatedAt
  }
}

mutation DeletePantryItem($id: ID!) {
  deletePantryItem(id: $id)
}
