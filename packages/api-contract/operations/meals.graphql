# Meal operations.
#
# Every field the app's runtime schemas parse is requested here, so a response
# that drifts from the contract fails at the service boundary rather than
# rendering as undefined three screens later.
#
# No operation sends a user id: the server resolves the viewer from the token.

fragment CostRangeFields on CostRange {
  point
  low
  high
  confidence
  tierMix
  basis
}

fragment GrocerySectionFields on GrocerySection {
  aisle
  items {
    ingredientId
    displayName
    neededQty
    unit
    packages
    packageLabel
    estimatedPrice
    priceTier
    inPantry
    isChecked
    usedBy
  }
}

fragment MealPlanFields on MealPlan {
  planId
  status
  pennyMessage
  swapOptions
  assumptions
  summary {
    householdSize
    mealsPlanned
    budget
    headroom
    consumedCostTotal
    pantryValueUsed
    pantryItemsUsed
    estimatedCost {
      ...CostRangeFields
    }
    nutritionGoal {
      goal
      metBy
      of
      avgProteinG
    }
    balancedMealBaseline {
      applied
      avgScore
    }
  }
  meals {
    slot {
      day
      mealType
    }
    recipeId
    title
    totalTimeMinutes
    scaleFactor
    servingsPlanned
    proteinGPerServing
    goalIndicator
    pantryIngredientsUsed
    incrementalCheckoutCost
    consumedCost
    why
  }
  groceryList {
    ...GrocerySectionFields
  }
}

fragment RecipeFields on Recipe {
  recipeId
  ownerUserId
  title
  description
  sourceType
  sourceUrl
  sourceName
  licenseId
  attributionText
  visibility
  reviewStatus
  servings
  servingsConfidence
  servingSizeText
  scalable
  prepTimeMinutes
  cookTimeMinutes
  totalTimeMinutes
  timeConfidence
  mealTypes
  cuisine
  difficulty
  equipmentRequired
  isComponent
  tags
  baseMealPlanEligible
  missingInformation
  ingredients {
    position
    rawText
    ingredientId
    displayName
    quantity
    unit
    preparation
    grams
    isOptional
    isToTaste
    missingInformation
  }
  instructions {
    step
    text
    minutes
  }
  nutrition {
    basis
    perServing
    caloriesKcal
    proteinG
    carbsG
    fatG
    fiberG
    sodiumMg
    coveragePct
    confidence
  }
}

fragment GroceryListPayloadFields on GroceryListPayload {
  planId
  sections {
    ...GrocerySectionFields
  }
  cost {
    ...CostRangeFields
  }
}

query CurrentMealPlan {
  currentMealPlan {
    ...MealPlanFields
  }
}

query MealPlan($planId: ID!) {
  mealPlan(planId: $planId) {
    ...MealPlanFields
  }
}

query Recipes($query: RecipeQueryInput) {
  recipes(query: $query) {
    ...RecipeFields
  }
}

query Recipe($recipeId: ID!) {
  recipe(recipeId: $recipeId) {
    ...RecipeFields
  }
}

query SavedRecipes {
  savedRecipes {
    ...RecipeFields
  }
}

query Ingredients($search: String, $limit: Int) {
  ingredients(search: $search, limit: $limit) {
    ingredientId
    displayName
    aisle
    foodGroup
    priceReferenceUnit
    isPantryStaple
    assumedOnHand
    allergens
  }
}

query GroceryList($planId: ID!) {
  groceryList(planId: $planId) {
    ...GroceryListPayloadFields
  }
}

mutation GenerateMealPlan($input: PlanRequestInput!) {
  generateMealPlan(input: $input) {
    ...MealPlanFields
  }
}

mutation SwapPlannedMeal($planId: ID!, $input: SwapMealInput!) {
  swapPlannedMeal(planId: $planId, input: $input) {
    ...MealPlanFields
  }
}

mutation MovePlannedMeal($planId: ID!, $input: MoveMealInput!) {
  movePlannedMeal(planId: $planId, input: $input) {
    ...MealPlanFields
  }
}

mutation AcceptMealPlan($planId: ID!) {
  acceptMealPlan(planId: $planId) {
    ...GroceryListPayloadFields
  }
}

mutation DeleteMealPlan($planId: ID!) {
  deleteMealPlan(planId: $planId)
}

mutation SetGroceryItemChecked($planId: ID!, $ingredientId: ID!, $checked: Boolean!) {
  setGroceryItemChecked(planId: $planId, ingredientId: $ingredientId, checked: $checked)
}

mutation GroceryListFromRecipes($input: GroceryListFromRecipesInput!) {
  groceryListFromRecipes(input: $input) {
    ...GroceryListPayloadFields
  }
}

mutation SaveRecipe($recipeId: ID!) {
  saveRecipe(recipeId: $recipeId)
}

mutation UnsaveRecipe($recipeId: ID!) {
  unsaveRecipe(recipeId: $recipeId)
}
