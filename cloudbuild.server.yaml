steps:
  - id: test
    name: golang:1.27
    dir: apps/server
    env: [CGO_ENABLED=0]
    waitFor: ['-']
    args: [go, test, ./...]

  - id: cache-pull
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    waitFor: ['-']
    args:
      - -ceu
      - |
        docker pull '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:buildcache' || true

  - id: build
    name: gcr.io/cloud-builders/docker
    env: [DOCKER_BUILDKIT=1]
    waitFor: [cache-pull]
    args:
      - build
      - --file=Dockerfile.server
      - --cache-from=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:buildcache
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:$BUILD_ID
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:buildcache
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    waitFor: [test, build]
    args:
      - -ceu
      - |
        docker push '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:$BUILD_ID'
        docker push '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:buildcache'

  - id: migrate-if-needed
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        CURRENT_SHA="$$(gcloud run services describe '${_SERVICE}' --project='$PROJECT_ID' --region='${_REGION}' --format='value(metadata.labels.hth-migrations-sha)' 2>/dev/null || true)"
        if [[ "$${CURRENT_SHA}" == "${_MIGRATIONS_SHA}" ]]; then
          echo 'Application migrations unchanged; skipping migration job.'
          exit 0
        fi
        gcloud run jobs update '${_MIGRATION_JOB}' \
          --project='$PROJECT_ID' \
          --region='${_REGION}' \
          --image='${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:$BUILD_ID' \
          --service-account='${_MIGRATION_SERVICE_ACCOUNT}' \
          --set-cloudsql-instances='${_INSTANCE_CONNECTION_NAME}' \
          --set-secrets='DATABASE_URL=${_DATABASE_SECRET}:latest' \
          --command=/app/migrate \
          --args=up \
          --tasks=1 \
          --max-retries=0 \
          --task-timeout=10m \
          --quiet
        gcloud run jobs execute '${_MIGRATION_JOB}' \
          --project='$PROJECT_ID' \
          --region='${_REGION}' \
          --wait

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        AUTH_URL="$$(gcloud run services describe '${_AUTH_SERVICE}' --project='$PROJECT_ID' --region='${_REGION}' --format='value(status.url)')"
        # Phase 2 integrations (Penny agent, recipe import). Empty values keep
        # an integration disabled: the Go server treats an unset/empty
        # PENNY_AGENT_URL / RECIPE_IMPORT_URL as "not configured" and falls
        # back gracefully. Secrets are only attached when their names are
        # provided, so a deploy without Phase 2 wiring changes nothing.
        PHASE2_SECRETS=()
        if [[ -n "${_PENNY_SERVICE_TOKEN_SECRET}" ]]; then
          PHASE2_SECRETS+=(--set-secrets="PENNY_SERVICE_TOKEN=${_PENNY_SERVICE_TOKEN_SECRET}:latest")
        fi
        if [[ -n "${_PENNY_TOOL_TOKEN_SECRET}" ]]; then
          PHASE2_SECRETS+=(--set-secrets="PENNY_TOOL_TOKEN_SECRET=${_PENNY_TOOL_TOKEN_SECRET}:latest")
        fi
        if [[ -n "${_IMPORT_SHARED_SECRET}" ]]; then
          PHASE2_SECRETS+=(--set-secrets="IMPORT_SHARED_SECRET=${_IMPORT_SHARED_SECRET}:latest")
        fi
        # Community resource lookup (Google Places API key). Only attached
        # when the secret name is provided; without it the endpoint returns
        # 503 and the app renders the lookup as unavailable. The secret must
        # already exist in Secret Manager — gcloud run deploy fails on a
        # nonexistent secret, so the name is only wired when explicitly set.
        if [[ -n "${_RESOURCES_PLACES_API_KEY_SECRET}" ]]; then
          PHASE2_SECRETS+=(--set-secrets="RESOURCES_PLACES_API_KEY=${_RESOURCES_PLACES_API_KEY_SECRET}:latest")
        fi
        # Signup/verification email (Resend). Without it the users module
        # refuses to send and signup verification silently never arrives.
        if [[ -n "${_RESEND_API_KEY_SECRET}" ]]; then
          PHASE2_SECRETS+=(--set-secrets="RESEND_API_KEY=${_RESEND_API_KEY_SECRET}:latest")
        fi
        # AI provider keys. Wired here (not via post-deploy --update-secrets)
        # so a redeploy never wipes them the way --set-secrets/--set-env-vars
        # replace the full config.
        if [[ -n "${_MEAL_AI_API_KEY_SECRET}" ]]; then
          PHASE2_SECRETS+=(--set-secrets="MEAL_AI_API_KEY=${_MEAL_AI_API_KEY_SECRET}:latest")
        fi
        if [[ -n "${_BENEFITS_AI_API_KEY_SECRET}" ]]; then
          PHASE2_SECRETS+=(--set-secrets="BENEFITS_AI_API_KEY=${_BENEFITS_AI_API_KEY_SECRET}:latest")
        fi
        gcloud run deploy '${_SERVICE}' \
          --project='$PROJECT_ID' \
          --region='${_REGION}' \
          --image='${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:$BUILD_ID' \
          --service-account='${_RUNTIME_SERVICE_ACCOUNT}' \
          --set-cloudsql-instances='${_INSTANCE_CONNECTION_NAME}' \
          --set-secrets='DATABASE_URL=${_DATABASE_SECRET}:latest' \
          "$${PHASE2_SECRETS[@]}" \
          --set-env-vars="APP_ENV=production,HTTP_ADDR=:8080,CORS_ALLOWED_ORIGINS=${_CORS_ALLOWED_ORIGINS},BETTER_AUTH_ISSUER=$${AUTH_URL},BETTER_AUTH_AUDIENCE=${_BETTER_AUTH_AUDIENCE},BETTER_AUTH_JWKS_URL=$${AUTH_URL}/api/auth/jwks,PENNY_AGENT_URL=${_PENNY_AGENT_URL},RECIPE_IMPORT_URL=${_RECIPE_IMPORT_URL},EMAIL_FROM=${_EMAIL_FROM},APP_PUBLIC_URL=${_APP_PUBLIC_URL},MEAL_AI_PROVIDER=${_MEAL_AI_PROVIDER},MEAL_AI_BASE_URL=${_MEAL_AI_BASE_URL},MEAL_AI_MODEL=${_MEAL_AI_MODEL},BENEFITS_AI_PROVIDER=${_BENEFITS_AI_PROVIDER},BENEFITS_AI_BASE_URL=${_BENEFITS_AI_BASE_URL},BENEFITS_AI_MODEL=${_BENEFITS_AI_MODEL}" \
          --port=8080 \
          --startup-probe='initialDelaySeconds=0,timeoutSeconds=3,periodSeconds=3,failureThreshold=10,httpGet.port=8080,httpGet.path=/healthz' \
          --liveness-probe='initialDelaySeconds=10,timeoutSeconds=3,periodSeconds=10,failureThreshold=3,httpGet.port=8080,httpGet.path=/healthz' \
          --min-instances='${_MIN_INSTANCES}' \
          --max-instances='${_MAX_INSTANCES}' \
          --update-labels='hth-migrations-sha=${_MIGRATIONS_SHA}' \
          --allow-unauthenticated \
          --quiet

  - id: verify
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        URL="$$(gcloud run services describe '${_SERVICE}' --project='$PROJECT_ID' --region='${_REGION}' --format='value(status.url)')"
        # Cloud Run validates /healthz through the configured internal probes;
        # its public frontend reserves some paths ending in "z".
        curl --fail --retry 8 --retry-all-errors --retry-delay 3 "$${URL}/readyz"
        test "$$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{"query":"{ viewer { user { id } } }"}' "$${URL}/graphql")" = 401

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:$BUILD_ID

substitutions:
  # Phase 2: Penny agent + recipe import wiring. All default to empty, which
  # leaves the integrations disabled (the Go server falls back gracefully).
  # scripts/deploy-gcp.sh fills these in from the environment.
  _PENNY_AGENT_URL: ''
  _RECIPE_IMPORT_URL: ''
  _PENNY_SERVICE_TOKEN_SECRET: ''
  _PENNY_TOOL_TOKEN_SECRET: ''
  _IMPORT_SHARED_SECRET: ''
  # Community resource lookup (Google Places API key secret name). Empty
  # leaves /resources/nearby returning 503 (honestly unavailable).
  _RESOURCES_PLACES_API_KEY_SECRET: ''
  # Signup/verification email (Resend API key secret name) and AI provider
  # wiring. scripts/deploy-gcp.sh fills these in; empty leaves the
  # integration unconfigured and the server falls back gracefully.
  _RESEND_API_KEY_SECRET: ''
  _MEAL_AI_API_KEY_SECRET: ''
  _BENEFITS_AI_API_KEY_SECRET: ''
  _EMAIL_FROM: ''
  _APP_PUBLIC_URL: ''
  _MEAL_AI_PROVIDER: ''
  _MEAL_AI_BASE_URL: ''
  _MEAL_AI_MODEL: ''
  _BENEFITS_AI_PROVIDER: ''
  _BENEFITS_AI_BASE_URL: ''
  _BENEFITS_AI_MODEL: ''

options:
  logging: CLOUD_LOGGING_ONLY
